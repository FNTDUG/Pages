.px-overlay {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background: var(--px-dim);
}
.px-overlay[hidden] { display: none; }

.px-pop, .px-pop * { box-sizing: border-box; }
.px-pop {
  width: var(--px-width); max-width: 100%;
  background: var(--px-frame);
  padding: 6px;
  clip-path: polygon(0 12px, 6px 12px, 6px 6px, 12px 6px, 12px 0, calc(100% - 12px) 0, calc(100% - 12px) 6px, calc(100% - 6px) 6px, calc(100% - 6px) 12px, 100% 12px, 100% calc(100% - 12px), calc(100% - 6px) calc(100% - 12px), calc(100% - 6px) calc(100% - 6px), calc(100% - 12px) calc(100% - 6px), calc(100% - 12px) 100%, 12px 100%, 12px calc(100% - 6px), 6px calc(100% - 6px), 6px calc(100% - 12px), 0 calc(100% - 12px));
  box-shadow: inset 6px 6px 0 var(--px-light), inset -6px -6px 0 var(--px-dark);
  animation: px-open .18s steps(3) backwards;
}
@keyframes px-open { from { transform: scale(.9); opacity: 0; } }

.px-bar {
  display: flex; align-items: center; gap: 12px;
  height: 42px;
  padding: 0 12px;
  background: var(--px-bar);
  box-shadow: inset 0 -6px 0 var(--px-dark);
}
.px-dots { display: flex; gap: 6px; flex: none; }
.px-dot {
  width: 18px; height: 18px; padding: 0; border: 0;
  display: grid; place-items: center;
  clip-path: polygon(3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px), 0 3px, 3px 3px);
}
.px-dot.red { background: #ff5f56; }
.px-dot.yellow { background: #ffbd2e; }
.px-dot.green { background: #27c93f; }
.px-bar-title {
  flex: 1;
  font-family: 'Press Start 2P', monospace;
  font-size: 9px; line-height: 1.4;
  color: var(--px-muted);
  margin: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.px-inner {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 24px;
  background: var(--px-body);
  padding: 24px;
  box-shadow: inset 6px 6px 0 var(--px-dark);
}

.px-text { min-width: 0; font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--px-text); }
.px-text h2 {
  font-family: inherit;
  font-size: 17px; font-weight: 700; line-height: 1.5;
  color: var(--px-heading);
  margin: 0 0 12px;
}
.px-text p, .px-text li {
  font-size: 14px; line-height: 1.7;
  color: var(--px-text);
  margin: 0 0 12px;
}
.px-text b { color: var(--px-bold); font-weight: 400; }
.px-text ul { margin: 0 0 12px; padding-left: 18px; }
.px-text li { margin: 0 0 6px; }
.px-text li::marker { color: var(--px-heading); }
.px-text a { color: var(--px-link); text-underline-offset: 3px; }
.px-text .px-code {
  font-family: 'Press Start 2P', monospace;
  font-size: 40px; line-height: 1;
  color: var(--px-link);
  text-shadow: 4px 4px 0 var(--px-dark);
  margin: 0 0 18px;
}
.px-text code {
  font-family: inherit; color: var(--px-text);
  background: rgba(110,118,129,.25);
  padding: 2px 6px; word-break: break-all;
}

.px-text .px-btn {
  display: inline-block;
  margin-top: 6px;
  font-family: 'Press Start 2P', monospace;
  font-size: 10px; line-height: 1;
  color: var(--px-body); text-decoration: none;
  background: var(--px-link);
  border: 0; cursor: pointer;
  padding: 12px 15px 11px;
  box-shadow: inset 3px 3px 0 var(--px-bold), inset -3px -3px 0 #1f6feb, 0 0 0 3px var(--px-dark);
}
.px-btn:hover { filter: brightness(1.08); }
.px-btn:active { box-shadow: inset -3px -3px 0 var(--px-bold), inset 3px 3px 0 #1f6feb, 0 0 0 3px var(--px-dark); }
.px-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.px-actions { display: flex; flex-wrap: wrap; gap: 12px; }

.px-stage {
  align-self: stretch;
  display: grid; place-items: center;
  min-width: calc(var(--px-sprite) + 48px);
  padding: 24px;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background-color: var(--px-stage);
}
.px-stage::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  box-shadow: inset 6px 6px 0 var(--px-dark), inset -6px -6px 0 var(--px-light);
}
.px-stage picture, .px-stage > .px-sprite { position: relative; z-index: 2; }
.px-scene { position: absolute; z-index: 0; pointer-events: none; }
.px-scene .ph-layer {
  position: absolute;
  inset: 0;
  background-repeat: repeat;
  background-size: 1536px 288px;
  image-rendering: pixelated;
}
.px-scene .ph-back { background-image: var(--px-tile); animation: ph-scroll 9.6s steps(12, end) infinite; }
.px-scene .ph-front { background-image: var(--px-tile-front); }
.px-scene .ph-typing { position: absolute; inset: 0; z-index: 1; }
.px-scene .ph-sq { position: absolute; height: 12px; }
@keyframes ph-scroll {
  from { background-position: 0 0; }
  to   { background-position: 0 -288px; }
}
.px-sprite {
  width: auto;
  height: auto;
  image-rendering: pixelated;
  display: block;
}

.px-mascot { display: block; position: relative; }
.px-mascot .px-l { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.px-mascot .px-body { clip-path: inset(0 0 calc(100% - var(--split) - 1px) 0); }
.px-mascot .px-body-low { clip-path: inset(var(--split) 0 0 0); animation: px-breathe 2.6s steps(5, jump-none) infinite alternate; }
.px-mascot .px-shut { visibility: hidden; }
.px-mascot.blink .px-open { visibility: hidden; }
.px-mascot.blink .px-shut { visibility: visible; }
@keyframes px-breathe {
  from { transform: translateY(0); }
  to   { transform: translateY(-5px); }
}
@media (max-width: 600px) {
  .px-inner { grid-template-columns: 1fr; justify-items: start; padding: 18px; gap: 12px; }
  .px-stage { grid-row: 1; justify-self: stretch; padding: 12px; }
  .px-text h2 { font-size: 15px; }
  .px-text .px-code { font-size: 30px; }
  .px-text p, .px-text li { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  .px-pop, .px-scene .ph-back, .px-mascot .px-body-low { animation: none; }
}
</style>
<style>
.px-overlay {
  --n-surface: #272436; --n-surface2: #312d44; --n-text: #f7f0e4; --n-mute: #bdb5cb; --n-ink: #06050a;
  --n-acc: #ff9a4d; --n-yellow: #ffd23f; --n-kick: var(--n-acc);
  --n-head: 'Archivo Black', system-ui, sans-serif; --n-body: 'Space Grotesk', system-ui, sans-serif;
  --px-width: 780px;
  background: rgba(6, 5, 10, .6);
}
html[data-theme="light"] .px-overlay {
  --n-surface: #fffaf2; --n-surface2: #ffe6bf; --n-text: #1d2228; --n-mute: #4d4a57; --n-ink: #1d2228; --n-acc: #ff8a3d;
  background: rgba(29, 34, 40, .45);
}
@media (prefers-color-scheme: light) {
  html:not([data-theme]) .px-overlay {
    --n-surface: #fffaf2; --n-surface2: #ffe6bf; --n-text: #1d2228; --n-mute: #4d4a57; --n-ink: #1d2228; --n-acc: #ff8a3d;
    background: rgba(29, 34, 40, .45);
  }
}
.px-overlay[data-kind="outage"] { --n-kick: #ff6b6b; }
.px-overlay[data-kind="wip"] { --n-kick: var(--n-yellow); }
.px-overlay[data-kind="update"] { --n-kick: #86d98a; }
.px-overlay[data-kind="tip"] { --n-kick: #8cc0ef; }

.px-pop {
  position: relative; padding: 0; clip-path: none;
  background: var(--n-surface); border: 3px solid var(--n-ink); box-shadow: 12px 12px 0 var(--n-ink);
  animation: n-pop .4s cubic-bezier(.55, .06, .68, .19) both;
}
@keyframes n-pop { from { transform: translate(-16px, -16px); opacity: 0; box-shadow: 28px 28px 0 var(--n-ink); } }
.px-bar { display: none; }
.px-x {
  position: absolute; top: -18px; right: -18px; z-index: 5;
  display: grid; place-items: center; width: 40px; height: 40px; padding: 0;
  font: 700 18px/1 var(--n-body); color: var(--n-text); background: var(--n-surface);
  border: 3px solid var(--n-ink); box-shadow: 3px 3px 0 var(--n-ink); cursor: pointer;
  transition: transform .12s, box-shadow .12s, background-color .12s;
}
.px-x:hover { color: #1d2228; background: var(--n-kick); transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--n-ink); }
.px-x:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--n-ink); }
.px-x:focus-visible { outline: 3px solid var(--n-yellow); outline-offset: 3px; }

.px-inner { gap: 30px; padding: 30px; background: var(--n-surface); box-shadow: none; }
.px-text { font-family: var(--n-body); color: var(--n-text); }
.px-kicker {
  display: inline-flex; align-items: center; gap: 9px; margin: 0 0 16px; padding: 7px 11px;
  font: 400 12px/1.2 var(--n-head); letter-spacing: .06em; text-transform: uppercase;
  color: #1d2228; background: var(--n-kick); border: 3px solid var(--n-ink);
  animation: n-rise .45s cubic-bezier(.34, 1.56, .64, 1) .15s both;
}
.px-kicker i { width: 8px; height: 8px; background: currentColor; }
.px-text h2 {
  margin: 0 0 14px; font: 400 28px/1.1 var(--n-head); color: var(--n-text); text-transform: uppercase;
  animation: n-rise .5s cubic-bezier(.34, 1.56, .64, 1) .22s both;
}
.px-hl { position: relative; display: inline-block; isolation: isolate; padding: calc(.1em + 3px) calc(.12em + 3px) calc(.07em + 3px); line-height: 1; color: #1d2228; }
.px-hl-bg { position: absolute; inset: 0; z-index: -1; background: var(--n-yellow); border: 3px solid var(--n-ink); transform-origin: 0 50%; animation: n-wipe .42s steps(6) .55s backwards; }
@keyframes n-wipe { from { transform: scaleX(0); } }
@keyframes n-rise { from { transform: translateY(22px); opacity: 0; } }
.px-text > p, .px-text > ul, .px-text > .px-actions, .px-text > .px-btn { animation: n-rise .5s cubic-bezier(.34, 1.56, .64, 1) .42s both; }
.px-text p, .px-text li { font-size: 16px; line-height: 1.55; color: var(--n-mute); }
.px-text p { margin: 0 0 10px; }
.px-text ul { list-style: none; margin: 0 0 12px; padding: 0; }
.px-text li { position: relative; margin: 0 0 6px; padding-left: 22px; }
.px-text li::before { content: ''; position: absolute; left: 0; top: .5em; width: 10px; height: 10px; box-sizing: border-box; background: var(--n-kick); border: 2px solid var(--n-ink); }
.px-text b { color: var(--n-text); font-weight: 700; }
.px-text a:not(.px-btn) { color: var(--n-text); font-weight: 700; text-decoration: underline; text-decoration-color: var(--n-kick); text-decoration-thickness: 3px; text-underline-offset: 3px; }
.px-text code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; color: var(--n-text); background: var(--n-surface2); padding: 2px 6px; }
.px-text .px-btn {
  margin-top: 8px; padding: 14px 20px; font: 700 15px/1 var(--n-body); color: var(--n-text); text-decoration: none;
  background: var(--n-surface); border: 3px solid var(--n-ink); box-shadow: 4px 4px 0 var(--n-ink);
  transition: transform .12s, box-shadow .12s;
}
.px-text .px-btn:last-of-type { color: #1d2228; background: var(--n-acc); }
.px-text .px-btn:hover { filter: none; transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--n-ink); }
.px-text .px-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--n-ink); }
.px-text .px-btn:focus-visible { outline: 3px solid var(--n-yellow); outline-offset: 3px; }
.px-actions { gap: 14px; }
.px-text > .px-btn + .px-btn { margin-left: 10px; }

.px-stage { padding: 16px; box-shadow: 0 0 0 7px var(--n-kick), 0 0 0 10px var(--n-ink); margin: 10px; }
.px-stage::after { box-shadow: inset 0 0 0 3px var(--n-ink); }
.px-stage > :not(.px-scene) { animation: n-drop .62s .45s both; }
@keyframes n-drop {
  0%   { transform: translateY(-420px); animation-timing-function: cubic-bezier(.55, .06, .68, .19); }
  62%  { transform: translateY(0); animation-timing-function: steps(3); }
  80%  { transform: translateY(-36px); animation-timing-function: steps(3); }
  100% { transform: translateY(0); }
}
@media (max-width: 600px) {
  .px-inner { padding: 22px; gap: 24px; }
  .px-text h2 { font-size: 24px; }
  .px-stage { padding: 12px; }
  .px-text p, .px-text li { font-size: 15px; }
  .px-x { top: -14px; right: -10px; }
}
@media (prefers-reduced-motion: reduce) {
  .px-pop, .px-kicker, .px-text h2, .px-hl-bg, .px-text > *, .px-stage > :not(.px-scene) { animation: none; }
}
</style>

<script>
(function () {
  var overlay = document.currentScript.previousElementSibling;
  var closeTo = overlay.getAttribute('data-close-to');   // a URL, or empty to just hide the popup
  function close() { if (closeTo) { location.href = closeTo; } else { overlay.hidden = true; } }
  overlay.querySelectorAll('[data-px-close]').forEach(function (b) { b.addEventListener('click', close); });
  overlay.querySelectorAll('[data-px-path]').forEach(function (el) { el.textContent = location.pathname; });
  overlay.querySelectorAll('[data-px-reload]').forEach(function (b) { b.addEventListener('click', function () { location.reload(); }); });
  overlay.querySelectorAll('[data-px-back]').forEach(function (b) { b.addEventListener('click', function () { if (history.length > 1) history.back(); else location.href = '/'; }); });
})();
</script>

<script>
/* Parvus's home: typing lines on top of the tiled code background.
   Usage: ParvusHome.mount(document.querySelector('.parvus-home'));
   The container needs a .ph-typing child (see index.html). Works at any width and height:
   it only types on the rows the front tile leaves empty, so everything stays on the 12px grid. */
(function () {
  'use strict';
  var U = 12;                         // one art pixel
  var TILE_ROWS = 24;                 // the tiles repeat every 24 pixels down
  var FREE_ROWS = [2, 8, 12, 18];     // rows left empty in the front tile, for typing
  var COLORS = ['#8b949e', '#8b949e', '#8b949e', '#79c0ff', '#d2a8ff', '#ffa657'];
  var TICK_MS = 70;

  function rand(n) { return Math.floor(Math.random() * n); }

  function ParvusHome(el, opts) {
    opts = opts || {};
    this.el = el;
    this.layer = el.querySelector('.ph-typing');
    if (!this.layer) { this.layer = document.createElement('div'); this.layer.className = 'ph-typing'; el.appendChild(this.layer); }
    this.lanesPer = opts.pixelsPerTyper || 640;   // one typing line per ~640px of width
    this.lanes = [];
    this.timer = null;
    this.reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.layout();
    var self = this;
    if (window.ResizeObserver) { this.ro = new ResizeObserver(function () { self.layout(); }); this.ro.observe(el); }
    document.addEventListener('visibilitychange', function () { document.hidden ? self.stop() : self.start(); });
    this.start();
  }

  ParvusHome.prototype.layout = function () {
    var cols = Math.floor(this.el.clientWidth / U), rows = Math.floor(this.el.clientHeight / U);
    var free = [];
    for (var base = 0; base < rows; base += TILE_ROWS) FREE_ROWS.forEach(function (r) { if (base + r < rows) free.push(base + r); });
    var n = Math.max(1, Math.round(this.el.clientWidth / this.lanesPer));
    this.layer.innerHTML = '';
    this.lanes = [];
    for (var i = 0; i < n; i++) {
      var lane = { x0: Math.floor(cols / n * i), span: Math.floor(cols / n), free: free, nodes: [], cursor: null,
                   phase: 'pause', t: 8 + i * 17, pos: 0, line: null };
      lane.cursor = this.square('#c9d1d9', 0.55); lane.cursor.style.display = 'none';
      this.lanes.push(lane);
    }
    this.cols = cols;
  };

  ParvusHome.prototype.square = function (color, opacity) {
    var d = document.createElement('div');
    d.className = 'ph-sq';
    d.style.background = color;
    d.style.opacity = opacity;
    this.layer.appendChild(d);
    return d;
  };

  ParvusHome.prototype.newLine = function (lane) {
    if (!lane.free.length) return null;
    var row = lane.free[rand(lane.free.length)];
    var start = lane.x0 + 2 + rand(Math.max(1, lane.span - 44));
    var segs = [], n = 3 + rand(4), len = -1;
    for (var s = 0; s < n; s++) { var w = 2 + rand(5); segs.push([w, COLORS[rand(COLORS.length)]]); len += w + 1; }
    lane.nodes.forEach(function (d) { d.remove(); });
    var self = this;
    lane.nodes = segs.map(function (sg) { return self.square(sg[1], 0.24); });
    return { row: row, start: start, segs: segs, len: len };
  };

  ParvusHome.prototype.draw = function (lane, blinkOn) {
    var L = lane.line;
    if (!L) return;
    var x = L.start, left = lane.pos;
    L.segs.forEach(function (sg, i) {
      var d = lane.nodes[i], vis = Math.max(0, Math.min(sg[0], left));
      d.style.display = vis ? 'block' : 'none';
      d.style.left = x * U + 'px'; d.style.top = L.row * U + 'px'; d.style.width = vis * U + 'px';
      left -= sg[0] + 1; x += sg[0] + 1;
    });
    var show = lane.phase === 'type' || lane.phase === 'erase' || (lane.phase === 'hold' && blinkOn);
    lane.cursor.style.display = show ? 'block' : 'none';
    lane.cursor.style.left = (L.start + lane.pos) * U + 'px';
    lane.cursor.style.top = L.row * U + 'px';
    lane.cursor.style.width = U + 'px';
  };

  ParvusHome.prototype.step = function () {
    this.tick = (this.tick || 0) + 1;
    var blinkOn = this.tick % 8 < 4, self = this;
    this.lanes.forEach(function (lane) {
      if (lane.phase === 'type') {
        if (lane.t > 0) lane.t--;
        else { lane.pos++; lane.t = Math.random() < 0.15 ? 3 : 0; if (lane.pos >= lane.line.len) { lane.phase = 'hold'; lane.t = 36; } }
      } else if (lane.phase === 'hold') {
        if (--lane.t <= 0) lane.phase = 'erase';
      } else if (lane.phase === 'erase') {
        lane.pos = Math.max(0, lane.pos - 2);
        if (lane.pos === 0) { lane.phase = 'pause'; lane.t = 14; }
      } else {
        if (--lane.t <= 0) { lane.line = self.newLine(lane); lane.pos = 0; lane.t = 0; lane.phase = lane.line ? 'type' : 'pause'; if (!lane.line) lane.t = 30; }
      }
      self.draw(lane, blinkOn);
    });
  };

  ParvusHome.prototype.start = function () {
    if (this.reduced || this.timer) return;
    var self = this;
    this.timer = setInterval(function () { self.step(); }, TICK_MS);
  };
  ParvusHome.prototype.stop = function () { clearInterval(this.timer); this.timer = null; };

  window.ParvusHome = { mount: function (el, opts) { return new ParvusHome(el, opts); } };
})();

(function () {
  var stage = document.querySelector('.px-stage');
  var scene = stage && stage.querySelector('.px-scene');
  var sprite = stage && stage.querySelector('.px-sprite');
  if (!scene || !sprite) return;
  var U = 12;
  var grid = (sprite.getAttribute('data-grid') || '0 0').split(' ').map(Number);
  function mod(v) { return ((v % U) + U) % U; }
  function fit() {
    var s = stage.getBoundingClientRect(), r = sprite.getBoundingClientRect();
    var k = s.width / stage.offsetWidth || 1;
    var left = mod((r.left - s.left) / k + grid[0]) - U;
    var top = mod((r.top - s.top) / k + grid[1]) - U;
    scene.style.left = left + 'px';
    scene.style.top = top + 'px';
    scene.style.width = Math.ceil((stage.offsetWidth - left) / U) * U + 'px';
    scene.style.height = Math.ceil((stage.offsetHeight - top) / U) * U + 'px';
  }
  fit();
  var pop = stage.closest('.px-pop');
  if (pop) pop.addEventListener('animationend', fit);
  sprite.addEventListener('load', fit);
  if (window.ResizeObserver) new ResizeObserver(function () { requestAnimationFrame(fit); }).observe(stage);
  if (window.ParvusHome) ParvusHome.mount(scene);
})();
