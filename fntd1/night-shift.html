<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night Shift / FNTD1 | FNTD Userguide</title>
  <link rel="icon" type="image/png" href="https://primary.jwwb.nl/public/g/h/p/temp-xkzspsgvvlzquzykopjj/circle_done-high-hapj13.png?enable-io=true&enable=upscale&height=70">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Audiowide&family=JetBrains+Mono:wght@400;700&family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  html,body{min-height:100vh;font-size:16px;scrollbar-width:thin;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  html{font-size:10px}
  body::-webkit-scrollbar{width:6px}
  body::-webkit-scrollbar-thumb{border-radius:3px}
  #ug-main{min-height:100vh;display:flex;flex-direction:column}
  #ug-hamburger{display:none;position:fixed;top:11px;right:12px;z-index:1200;border-radius:22px;padding:7px 13px 7px 10px;cursor:pointer;font-size:10px;letter-spacing:.4px;align-items:center;gap:6px;transition:background .15s,border-color .15s}
  #ug-hamburger .hmb-icon{font-size:16px;line-height:1}
  #ug-overlay{display:none;position:fixed;inset:0;z-index:1099}
  #ug-overlay.open{display:block}
  #ug-mobile-nav{position:fixed;top:0;right:0;width:min(290px,88vw);height:100vh;z-index:1100;overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;scrollbar-width:thin}
  #ug-mobile-nav::-webkit-scrollbar{width:3px}
  #ug-mobile-nav::-webkit-scrollbar-thumb{border-radius:2px}
  #ug-mobile-nav.open{transform:translateX(0)}
  .ug-mn-header{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 13px;flex-shrink:0}
  .ug-mn-brand{display:flex;align-items:center;gap:10px}
  .ug-mn-brand-logo{width:30px;height:30px;object-fit:contain}
  .ug-mn-brand-name{font-size:12px;line-height:1.2}
  .ug-mn-close{border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex-shrink:0;line-height:1;transition:background .13s,color .13s,border-color .13s}
  .ug-mn-body{flex:1;padding:6px 0 12px}
  .ug-mn-link{display:flex;align-items:center;padding:12px 18px;font-size:10.5px;letter-spacing:.3px;text-decoration:none;transition:background .12s,color .12s}
  .ug-mn-section-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px 18px;border:none;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;text-align:left;transition:background .12s,color .12s}
  .ug-mn-section-arrow{opacity:.55;font-size:13px;flex-shrink:0;font-style:normal;min-width:.8em;text-align:center;transition:opacity .12s,color .12s}
  .ug-mn-section.open .ug-mn-section-btn .ug-mn-section-arrow{opacity:1}
  .ug-mn-section-items{max-height:0;overflow:hidden;transition:max-height .28s ease}
  .ug-mn-section.open .ug-mn-section-items{max-height:500px}
  .ug-mn-child{display:block;padding:9px 18px 9px 28px;font-size:10px;letter-spacing:.2px;text-decoration:none;transition:background .11s,color .11s}
  .ug-mn-child:last-child{border-bottom:none}
  .ug-mn-child.active{border-left:2px solid var(--ug-accent);padding-left:26px}
  .ug-mn-discord-wrap{padding:14px 14px 4px}
  .ug-mn-discord{display:flex;align-items:center;gap:9px;padding:11px 14px;border-radius:9px;font-size:10.5px;text-decoration:none;letter-spacing:.3px;transition:background .13s,border-color .13s,color .13s}
  #ug-hero{position:relative}
  #ug-hero::before{content:'';position:absolute;inset:0;pointer-events:none}
  #ug-hero-inner{position:relative;z-index:1;padding:24px 18px 22px;max-width:860px;width:100%;margin:0 auto}
  #ug-content{flex:1;padding:22px 18px 50px;max-width:860px;width:100%;margin:0 auto}
  .ug-page-title-area{text-align:center;margin-bottom:18px}
  .ug-page-title{font-size:32px;margin-bottom:10px;text-decoration:underline;text-underline-offset:6px}
  .ug-status-badge{display:inline-block;padding:6px 18px;border-radius:20px;font-size:10px;margin-bottom:12px}
  .ug-section-title{font-family:'Audiowide',sans-serif;font-size:22px;color:#fff;text-align:center;margin-bottom:12px;padding-bottom:0;border-bottom:none;letter-spacing:.5px}
  .ug-img-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;align-items:start}
  #ug-content .ug-img-pair img{max-width:100%;height:auto;display:block;margin:0 0 8px}
  @media(max-width:600px){.ug-img-pair{grid-template-columns:1fr}}
  #ug-content img{max-width:100%;height:auto;display:block;margin:0 auto 16px}
  .ug-divider-img{width:100%;height:auto;display:block;margin:20px auto}
  .ug-section{margin-bottom:28px}
  .ug-note{font-size:16px;color:#fff;line-height:1.75;margin-bottom:16px}
  @media(max-width:768px){#ug-hamburger{display:flex}}
  @media(max-width:480px){.ug-page-title{font-size:22px}}
  .ug-mn-child.active::after,.ug-mn-link.active::after{content:"|";margin-left:4px;font-weight:400}body.ug-cursor-off .ug-mn-child.active::after,body.ug-cursor-off .ug-mn-link.active::after{opacity:0}</style>
  <style>
  .clean-pill{display:inline-block;padding:14px 14px;text-shadow:0 0 6px rgba(255,107,107,0.6);border-radius:20px;background:rgba(34,34,34,0.85);position:relative;overflow:hidden;border:2px solid #5a1a1a;color:#ff6b6b;font-size:14px;font-family:'Audiowide',sans-serif;cursor:pointer;user-select:none;text-align:center;box-shadow:inset 0 2px 4px rgba(255,255,255,0.08),inset 0 -4px 8px rgba(0,0,0,0.6),0 8px 0 #000,0 10px 20px rgba(0,0,0,0.5);transition:all 0.15s ease;animation:flicker 2s infinite}
  .clean-pill.on{border-color:#4dff88;color:#8cffb0}
  .clean-pill:hover{transform:translateY(2px)}
  .clean-pill::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(to bottom,rgba(255,255,255,0.05) 0px,rgba(255,255,255,0.05) 1px,transparent 2px,transparent 4px);pointer-events:none;opacity:0.3}
  .clean-text{margin-top:14px;font-family:'Press Start 2P',cursive;font-size:10px;color:#FFFFFF;text-align:center;line-height:1.6;opacity:0.85}
  @keyframes flicker{0%{opacity:1}50%{opacity:0.95}100%{opacity:1}}
  .ad-slot{text-align:center}
  .info-card{max-width:700px;margin:0 auto 16px;display:flex;flex-direction:column;gap:10px}
  .info-card-section{background:#1a1b1e;border-radius:8px;padding:14px 18px;position:relative}
  .info-card-section::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#ffa45b;border-radius:3px 0 0 3px;box-shadow:0 0 8px rgba(255,164,91,.25),-2px 0 10px rgba(255,164,91,.15)}
  .info-card-section h4{font-family:'Audiowide',sans-serif;font-size:16px;color:var(--ug-accent);margin:0 0 6px;letter-spacing:.5px;text-align:center}
  .info-card-section p{font-size:16px;color:#fff;line-height:1.8;margin:0;text-align:center}
  </style>
</head>
<body>

  <button id="ug-hamburger" onclick="ugMobileToggle()" aria-label="Toggle menu"><span class="hmb-icon">&#9776;</span> Menu</button>
  <div id="ug-overlay" onclick="ugMobileClose()"></div>

  <div id="ug-mobile-nav" role="navigation" aria-label="Mobile navigation">
    <div class="ug-mn-header">
      <div class="ug-mn-brand">
        <img class="ug-mn-brand-logo pv-mn-logo" src="/overhaul/parvus_fntdug_px.png?v=2" alt="" width="60" height="50">
        <span class="ug-mn-brand-name">FNTD User Guide</span>
      </div>
      <button class="ug-mn-close" onclick="ugMobileClose()" aria-label="Close menu">&#x2715;</button>
    </div>
    <div class="ug-mn-body"></div>
  </div>

  <div id="ug-main">

    <div id="ug-hero">
      <div id="ug-hero-inner">
        <div class="ug-page-title-area">
          <div class="ug-page-title">Night Shift</div>
          <div class="ug-status-badge">Last updated 8/30/25 (Up-To-Date!)</div>
        </div>


      </div>
    </div>

    <div id="ug-content">

      <div class="ug-section">
        <div class="ug-section-title">Current Best Teams</div>
        <img src="https://primary.jwwb.nl/public/g/h/p/temp-xkzspsgvvlzquzykopjj/image-high-rpcj6u.png?enable-io=true&enable=upscale&crop=2.1788%3A1&width=800" alt="Night Shift Best Teams">
      </div>

      <div class="ug-section">
        <div class="info-card">
          <div class="info-card-section">
            <h4>Notes:</h4>
            <p>The higher your power is, the greater the rewards.<br>
            <strong>JJ</strong> is also a good option with a full team of Balloon Boys.</p>
          </div>
        </div>
        <div class="ug-section-title">Map Layout &amp; Placements</div>
      </div>

      <div class="ug-img-pair">
        <div>
          <div class="ug-section-title">Night 1</div>
          <img src="https://primary.jwwb.nl/public/g/h/p/temp-xkzspsgvvlzquzykopjj/image-high-r36vat.png?enable-io=true&enable=upscale&crop=1.5%3A1&width=800" alt="Night 1 Map">
        </div>
        <div>
          <div class="ug-section-title">Night 2</div>
          <img src="https://primary.jwwb.nl/public/g/h/p/temp-xkzspsgvvlzquzykopjj/image-high-04xkg1.png?enable-io=true&enable=upscale&crop=1.496%3A1&width=800" alt="Night 2 Map">
        </div>
      </div>

      <div class="ad-slot" style="max-width:600px;width:95%;margin:32px auto 8px"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7017245771068026" data-ad-slot="9010982209" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle = window.adsbygoogle || []).push({});</script></div>
    </div>

    <footer id="ug-footer"></footer>
  </div>

  <script>
  function ugMobileOpen(){document.getElementById('ug-mobile-nav').classList.add('open');document.getElementById('ug-overlay').classList.add('open');document.body.style.overflow='hidden'}
  function ugMobileClose(){document.getElementById('ug-mobile-nav').classList.remove('open');document.getElementById('ug-overlay').classList.remove('open');document.body.style.overflow=''}
  function ugMobileToggle(){var isOpen=document.getElementById('ug-mobile-nav').classList.contains('open');isOpen?ugMobileClose():ugMobileOpen()}
  var _SPIN_FRAMES=['/','-','\\','|'];var _mnSpinTimers=new Map();
  function ugMnSpinStart(btn){if(_mnSpinTimers.has(btn))clearInterval(_mnSpinTimers.get(btn));var arrow=btn.querySelector('.ug-mn-section-arrow');if(!arrow)return;var i=0;arrow.textContent=_SPIN_FRAMES[0];_mnSpinTimers.set(btn,setInterval(function(){i=(i+1)%_SPIN_FRAMES.length;arrow.textContent=_SPIN_FRAMES[i]},135))}
  function ugMnSpinStop(btn){if(_mnSpinTimers.has(btn)){clearInterval(_mnSpinTimers.get(btn));_mnSpinTimers.delete(btn)}var arrow=btn.querySelector('.ug-mn-section-arrow');if(arrow)arrow.textContent='/'}
  function ugMnToggle(btn){var section=btn.closest('.ug-mn-section');var isOpen=section.classList.contains('open');document.querySelectorAll('#ug-mobile-nav .ug-mn-section.open').forEach(function(s){if(s!==section){s.classList.remove('open');var b=s.querySelector('.ug-mn-section-btn');if(b)ugMnSpinStop(b)}});section.classList.toggle('open');if(!isOpen){ugMnSpinStart(btn)}else{ugMnSpinStop(btn)}}
  var _spinTimers=new Map();
  function ugSpinStart(btn){var arrow=btn.querySelector('.ug-tn-arrow');if(!arrow)return;var i=0;arrow.textContent=_SPIN_FRAMES[0];_spinTimers.set(btn,setInterval(function(){i=(i+1)%_SPIN_FRAMES.length;arrow.textContent=_SPIN_FRAMES[i]},135))}
  function ugSpinStop(btn){if(_spinTimers.has(btn)){clearInterval(_spinTimers.get(btn));_spinTimers.delete(btn)}var arrow=btn.querySelector('.ug-tn-arrow');if(arrow)arrow.textContent='/'}
  var _ugLeaveTimer=null;
  function _ugScheduleClose(){clearTimeout(_ugLeaveTimer);_ugLeaveTimer=setTimeout(ugCloseAll,150)}
  function _ugCancelClose(){clearTimeout(_ugLeaveTimer)}
  function ugCloseAll(){clearTimeout(_ugLeaveTimer);document.querySelectorAll('.ug-tn-item.open').forEach(function(el){el.classList.remove('open');var b=el.querySelector('.ug-tn-btn');if(b)ugSpinStop(b);var d=el.querySelector('.ug-tn-drop');if(d){d.style.display='none';d.style.top='';d.style.left=''}})}
  function ugTnToggle(btn){var item=btn.closest('.ug-tn-item');if(!item)return;var isOpen=item.classList.contains('open');ugCloseAll();if(!isOpen){item.classList.add('open');ugSpinStart(btn);var drop=item.querySelector('.ug-tn-drop');if(drop){var r=item.getBoundingClientRect();drop.style.top=r.bottom+'px';drop.style.left=r.left+'px';drop.style.display='block'}}}
  function _ugOpenItem(item){var btn=item.querySelector('.ug-tn-btn');if(!btn||item.classList.contains('open'))return;ugCloseAll();item.classList.add('open');ugSpinStart(btn);var drop=item.querySelector('.ug-tn-drop');if(drop){var r=item.getBoundingClientRect();drop.style.top=r.bottom+'px';drop.style.left=r.left+'px';drop.style.display='block'}}
  document.querySelectorAll('.ug-tn-item').forEach(function(item){item.addEventListener('mouseenter',function(){_ugCancelClose();_ugOpenItem(item)});item.addEventListener('mouseleave',_ugScheduleClose);var drop=item.querySelector('.ug-tn-drop');if(drop){drop.addEventListener('mouseenter',_ugCancelClose);drop.addEventListener('mouseleave',_ugScheduleClose)}});
  document.addEventListener('click',function(e){if(!e.target.closest||!e.target.closest('.ug-tn-item'))ugCloseAll()});
  window.addEventListener('resize',ugCloseAll,{passive:true});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){ugCloseAll();ugMobileClose()}});
  (function(){var toggle=document.getElementById('cleanModeToggle');if(!toggle)return;var cleanMode=false;toggle.onclick=function(){cleanMode=!cleanMode;toggle.classList.toggle('on',cleanMode);toggle.textContent='Clean-Mode: '+(cleanMode?'On':'Off');document.querySelectorAll('.ad-slot').forEach(function(ad){ad.style.display=cleanMode?'none':''})};})();
  </script>
<script>(function(){var on=true,t=setInterval(function(){on=!on;document.body.classList.toggle("ug-cursor-off",!on)},500);document.querySelectorAll("#ug-mobile-nav .ug-mn-section.open .ug-mn-section-btn").forEach(function(btn){ugMnSpinStart(btn)});document.addEventListener("visibilitychange",function(){if(!document.hidden){clearInterval(t);on=true;document.body.classList.remove("ug-cursor-off");t=setInterval(function(){on=!on;document.body.classList.toggle("ug-cursor-off",!on)},500);document.querySelectorAll("#ug-mobile-nav .ug-mn-section.open .ug-mn-section-btn").forEach(function(btn){ugMnSpinStop(btn);ugMnSpinStart(btn)})}})})();</script></body>
</html>
