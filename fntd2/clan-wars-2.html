<style>
#cw2, #cw2 * { font-family: 'Press Start 2P', cursive; box-sizing: border-box; }
#cw2 {

#cw2 .cw-inner { max-width: 980px; margin: 0 auto; }

#cw2 .cw-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
#cw2 .cw-row.cw-els { grid-template-columns: repeat(3, 1fr); margin-bottom: 0; }
#cw2 .cw-field { min-width: 0; }
#cw2 .ue-csel-wrap { min-width: 0; max-width: 100%; }
#cw2 .cw-field label { display: block; font-size: 8px; letter-spacing: 1px; color: #ffb14a; margin-bottom: 7px; text-transform: uppercase; }
#cw2 .cw-reset { margin-top: 14px; padding: 9px 16px; font-size: 8px; letter-spacing: 1px; color: #ff8f8f; background: rgba(60,12,12,.85); border: 2px solid #6d1f1f; border-radius: 6px; cursor: pointer; }
#cw2 .cw-reset:hover { background: rgba(90,18,18,.9); }

#cw2 .ue-csel-wrap { position: relative; width: 100%; box-sizing: border-box; }
#cw2 .ue-csel-btn {
  width: 100%;
  padding: 9px 10px;
  border-radius: 8px;
  border: 1px solid rgba(255, 164, 91, 0.4);
  background-color: rgba(8, 6, 18, 0.9);
  color: #fff;
  font-size: 10px;
  box-sizing: border-box;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  line-height: 1.4;
  transition: border-color 0.15s;
  user-select: none;
  -webkit-user-select: none;
}
#cw2 .ue-csel-btn:hover, #cw2 .ue-csel-btn.ue-csel-open { border-color: #ffb14a; }
#cw2 .ue-csel-btn-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#cw2 .ue-csel-btn-label.ue-csel-placeholder { opacity: 0.42; }
#cw2 .ue-csel-arrow { flex-shrink: 0; font-size: 7px; opacity: 0.55; font-family: Arial, sans-serif !important; transition: transform 0.18s; }
#cw2 .ue-csel-btn.ue-csel-open .ue-csel-arrow { transform: rotate(180deg); }
#cw2 .ue-csel-btn.ue-csel-disabled { opacity: 0.38; cursor: not-allowed; pointer-events: none; }
#cw2 .ue-csel-popup {
  position: absolute;
  z-index: 9600;
  background: rgba(10, 7, 22, 0.97);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 10px;
  border: 2px solid rgba(255, 164, 91, 0.55);
  box-shadow: 0 10px 36px rgba(0,0,0,0.82), 0 0 16px rgba(255,164,91,0.07);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#cw2 .ue-csel-search-wrap { border-bottom: 1px solid rgba(255,164,91,0.28); background: rgba(0,0,0,0.18); }

#cw2 .ue-csel-search::placeholder { color: rgba(255,255,255,0.3); }

#cw2 .ue-csel-item.ue-csel-item-cur { color: #ffa45b; }
#cw2 .ue-csel-item.ue-csel-item-ph { color: rgba(255,255,255,0.38); }
#cw2 .ue-csel-item.ue-csel-item-off { opacity: 0.3; cursor: not-allowed; }

#cw2 .cw-slot:hover { border-color: #ffd98a; }
#cw2 .cw-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }

  }

  var selObj = mkSelect('cw2Obj', OBJECTIVES, 'Pick an objective', function (v) { state.obj = v; shown = 24; render(); });
  var selRes = mkSelect('cw2Res', RESTRICTIONS, 'Pick a restriction', function (v) { state.res = v; shown = 24; render(); });
  var selBan = mkSelect('cw2Ban', elOptsFor('ban'), 'Pick an element', onElement('ban', 'ban'));
  var selBuf = mkSelect('cw2Buf', elOptsFor('buf'), 'Pick an element', onElement('buf', 'buf'));
  var selDeb = mkSelect('cw2Deb', elOptsFor('deb'), 'Pick an element', onElement('deb', 'deb'));

  el('cw2More').addEventListener('click', function () { shown += 24; render(); });
  el('cw2Auto').addEventListener('click', autoFill);
  el('cw2Clear').addEventListener('click', function () { team = [null, null, null, null, null, null]; renderTeam(); });
  el('cw2PickClose').addEventListener('click', closePick);
  el('cw2Pick').addEventListener('click', function (e) { if (e.target === this) closePick(); });

  el('cw2Slots').addEventListener('click', function (e) {
    var slot = e.target.closest ? e.target.closest('.cw-slot') : null;
    if (!slot) return;
    var i = Number(slot.getAttribute('data-slot'));
    if (team[i]) {
      removeUnit(team[i].name);
      renderTeam();
      return;
    }
    openPick(i);
  });

  el('cw2PickList').addEventListener('click', function (e) {
    var card = e.target.closest ? e.target.closest('.cw-unit') : null;
    if (!card || pickSlot < 0) return;
    var entry = entryFor(card.getAttribute('data-unit'));
    if (entry) placeAt(entry, pickSlot);
    closePick();
    renderTeam();
  });

  el('cw2Grid').addEventListener('click', function (e) {
    var card = e.target.closest ? e.target.closest('.cw-unit') : null;
    if (card) addToTeam(card.getAttribute('data-unit'));
  });

  el('cw2Reset').addEventListener('click', function () {
    state = { obj: '', res: '', ban: '', buf: '', deb: '' };
    [selObj, selRes, selBan, selBuf, selDeb].forEach(function (w) { w._set(''); });
    refreshElements();
    shown = 24;
    render();
  });

  document.addEventListener('click', function () { if (typeof _cselClose === 'function') _cselClose(); });
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closePick(); _cselClose(); } });
  window.addEventListener('resize', sizeSlots, { passive: true });

  el('cw2Grid').innerHTML = '<div class="cw-empty">Loading units...</div>';

  fetch(UNITS_URL)
    .then(function (r) { return r.json(); })
    .then(function (json) {
      units = (Array.isArray(json) ? json : []).filter(function (u) { return u && u.name; });
      render();
    })
    .catch(function () {
      el('cw2Grid').innerHTML = '<div class="cw-empty">Could not load the unit list. Refresh the page.</div>';
    });

})();
</script>
