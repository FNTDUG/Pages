<style>
/* Reuses the Challenges UI wholesale: .ch-card, .chOv/.chPop, .chRw and friends
   are the same classes that page defines, so the two stay in step. Only what
   Challenges has no equivalent for is added here, nr- prefixed. */
.chWrap{position:relative;margin-top:8px}

/* This page only: the shared sheet pins #ug-main and #ug-hero with
   background-attachment:fixed. That is what makes the backdrop appear to hold
   still while the page scrolls, and it costs a full repaint of the backdrop on
   every scroll frame — expensive here, where the page is long and already
   carrying a lot of image. Scrolling them with the content is free and looks
   identical when the page is at rest. Overridden here rather than in the shared
   block above, so the other pages keep the effect. */
#ug-main,#ug-hero{background-attachment:scroll}

/* Arcade scanlines over the entire page rather than per panel. One fixed layer
   above the popups and the meta tooltip, so nothing sits outside the effect and
   overlapping panels cannot double its density. */
/* Absolute inside #ug-main, not fixed to the viewport. Fixed leaves the lines
   standing still while the page slides underneath, which reads as the scanlines
   racing across the content; Challenges anchors its to the element so they
   travel with it. Same 4px period and .06 alpha it uses. Popups scroll
   independently and are position:fixed, so they carry their own .chScan. */
#ug-main{position:relative}
.nrArcade{position:absolute;inset:0;pointer-events:none;z-index:900;
  background:repeating-linear-gradient(to bottom,
    transparent 0px,transparent 3px,rgba(0,0,0,.06) 3px,rgba(0,0,0,.06) 4px)}
.chScan{position:relative}
.chScan::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:900;border-radius:inherit;
  background:repeating-linear-gradient(to bottom,
    transparent 0px,transparent 3px,rgba(0,0,0,.06) 3px,rgba(0,0,0,.06) 4px)}

/* ── selectable card (games, then nights) ────────────────────────────── */
.ch-card{position:relative;display:block;width:100%;border:2px solid rgba(255,255,255,.75);
  border-radius:2px;overflow:hidden;cursor:pointer;margin-bottom:14px;
  background:#1a1030 center/cover no-repeat;aspect-ratio:6/1;min-height:118px;
  text-align:left;font:inherit;color:inherit;transition:border-color .14s,transform .1s}
.ch-card:hover{border-color:var(--ug-accent)}
/* best:true — a warm border and a soft outer glow. Deliberately restrained: the
   cards already carry map art and a white border, so the tell is the colour
   shift plus a little light around the edge, not a badge or a flashing outline.
   Amber rather than pure yellow, so it reads as a highlight next to the site's
   orange rather than as a warning. */
.ch-card.ch-best{border-color:#ffd75e;
  box-shadow:0 0 0 1px rgba(255,215,94,.35),0 0 14px rgba(255,215,94,.22)}
.ch-card.ch-best:hover{border-color:#ffe89a;
  box-shadow:0 0 0 1px rgba(255,215,94,.55),0 0 20px rgba(255,215,94,.38)}
@media(prefers-reduced-motion:reduce){.ch-card.ch-best{transition:none}}
.ch-card:active{transform:translateY(1px)}
.ch-card:focus-visible{outline:2px solid var(--ug-accent);outline-offset:3px}
/* A game card shows its six night maps across, rather than one picture. Equal
   flex cells so the split holds at any width, with min-width:0 because a flex
   item will not shrink below its content otherwise. A hairline between them
   keeps six dark maps from reading as one smear. */
.nrMapStrip{position:absolute;inset:0;display:flex}
.nrMapCell{flex:1 1 0;min-width:0;position:relative;overflow:hidden;background:#1a1030;
  box-shadow:inset -1px 0 0 rgba(0,0,0,.55)}
.nrMapCell:last-child{box-shadow:none}
/* An <img> rather than a background so loading="lazy" applies: the strips add up
   to 42 maps at a couple of megabytes each, and a CSS background would fetch
   every one on load. !important beats #ug-content img from the shared sheet. */
.nrMapCell img{width:100%!important;height:100%!important;object-fit:cover;display:block;
  margin:0!important;max-width:none!important}
.ch-card .chVeil{position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(6,4,14,.82) 0%,rgba(6,4,14,.45) 45%,rgba(6,4,14,.12) 100%)}
.ch-inner{position:relative;z-index:1;height:100%;padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between}
.ch-name{font-family:'Press Start 2P',monospace;font-size:15px;line-height:1.2;
  text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.ch-diff{font-family:'Press Start 2P',monospace;font-size:8px;margin-top:5px;color:#c07bf0;text-shadow:1px 1px 0 #000}

/* ── popup shell (identical to Challenges) ───────────────────────────── */
.chOv{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(4,3,10,.86);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.chOv[hidden]{display:none}
/* the rewards popup opens over the night list, which stays behind it so closing
   one step reveals the other rather than dumping you back to the games */
#rwOv{z-index:2147483005}
/* The meta engine appends #metaTip to <body> at z-index:10000, which lands under
   these overlays — the tooltip still computes as displayed, it is just painted
   behind the popup, so it looks like the hover does nothing. Lift it clear of
   both overlays. The page scanlines sit at 900 inside #ug-main and the popups
   carry their own, so nothing here competes with them. */
#metaTip{z-index:2147483010!important}
body.ch-modal #ug-hamburger{display:none!important}
/* vh on a phone is the LARGE viewport — the height the page would have with the
   browser's address bar retracted — so while that bar is on screen 88vh is taller
   than what you can actually see and the popup runs off the bottom. dvh tracks the
   real height. The vh line stays first as the fallback for anything without dvh. */
.chPop{position:relative;width:min(860px,100%);max-height:88vh;max-height:88dvh;overflow:hidden;
  display:flex;flex-direction:column;border:2px solid rgba(255,255,255,.8);
  border-radius:2px;background:#150c28 center/cover no-repeat;animation:chPopIn .18s ease-out}

   renders share a single plate the same size as every other tile, offset from
   each other so the pair reads as one item with two faces rather than as two
   separate drops. B sits behind and dimmed, A in front. */

   matching it here both parts fill the plate and the offset collapses to a
   couple of pixels. At 68% the two sit a clear third of the plate apart. */

<!-- metas.html renders real meta blocks here; the team row is moved into the
     popup on open, which keeps the byte/chip/enchant badges and the hover
     tooltip identical to Meta Teams instead of a second copy that can drift.
     Filled from GAME_TEAM / NIGHT_TEAM below, before metas.html loads, so
     adding a game's team needs no edit here. -->

<script>
(function(){

/* ─── reward model ───────────────────────────────────────────────────────
   Measured for Games 1-4; Games 5-7 share Game 4's table. Confirmed rules,
   each verified against at least two games:
     nights 1-6   coins = base + 10*(n-1)      candy = base (flat)
     Nightmare    every value x1.5, rounded half up
     night 7      take the night-6 value, x(1 + d/40) for difficulty d 1-20
   The night-7 scale reaches exactly x1.5 at d20, so Easy night 7 at d20 equals
   Nightmare night 6 — a self-check that holds in every game.

   Per-game bases are authored, not computed: the coin step runs +60,+60,+50
   then flat, and candy goes 6,8,8,8, so neither fits a formula.             */
var COIN_BASE  = {1:100, 2:160, 3:220, 4:270, 5:270, 6:270, 7:270};
var CANDY_BASE = {1:6,   2:8,   3:8,   4:8,   5:8,   6:8,   7:8};
var EXP_BASE   = {1:20,  2:23,  3:26,  4:26,  5:26,  6:26,  7:26};

/* Exp is the one value with two different per-night shapes:
     'A'  +1 every 2 nights   (Games 1-2, measured)
     'B'  +1 then +2 a night  (Game 3, measured)
   !! Game 4's shape is NOT confirmed. Set to 'B' because Game 4 shares Game 3's
   !! night-1 exp (26) and candy (8), but night 1 alone cannot tell them apart.
   !! Game 4 night 2 decides it: exp 26 means 'A', 27 means 'B'. If it is 26,
   !! change the four entries below and nothing else. */
var EXP_CURVE  = {1:'A', 2:'A', 3:'B', 4:'B', 5:'B', 6:'B', 7:'B'};

var TIERS = [{key:'easy',label:'Easy'},{key:'nightmare',label:'Nightmare'}];
var MAX_DIFF = 20;

function rh(x){ return Math.round(x); }          // halves round up, as the game does
function expFor(g,n){
  var b = EXP_BASE[g];
  if (EXP_CURVE[g] === 'A') return b + Math.floor((n-1)/2);
  return n === 1 ? b : b + 1 + 2*(n-2);
}
/* Scaling by (40+d)/40 rather than 1+0.025*d keeps the arithmetic on exact
   halves, so the rounding never drifts on a float. */
function rewardsFor(g,n,tierKey,d){
  var m = n < 7 ? n : 6;
  var c = COIN_BASE[g] + 10*(m-1), y = CANDY_BASE[g], e = expFor(g,m);
  var t = tierKey === 'nightmare' ? 1.5 : 1;
  c = rh(c*t); y = rh(y*t); e = rh(e*t);
  if (n === 7){ var k = 40 + d; c = rh(c*k/40); y = rh(y*k/40); e = rh(e*k/40); }
  return {coins:c, candy:y, exp:e};
}

/* ─── art ────────────────────────────────────────────────────────────────
   Card art and popup art are kept apart so either can be swapped without
   disturbing the other. */
var MAP_BASE = 'https://images.fntduserguide.com/';
var MAPS_PER_GAME = 6;
/* Maps are named <game>-<night>.png in the bucket, so the URL is derived rather
   than listed — 42 entries would need re-editing every time one is replaced.
   NIGHT_MAPS overrides a single night if one ever needs a file off that scheme;
   keyed "<game>-<night>". */
var NIGHT_MAPS = {};
/* Only the night list has art of its own. The rewards popup takes the art of
   the night card you opened it from, the way Challenges puts a challenge's map
   behind its popup. */
var POPUP_BG = {
  nights: 'https://images.fntduserguide.com/carbon-fiber-background.jpg'
};
/* Night 7 shares night 6's map, so anything past 6 clamps to it. */
function nightArt(g, n){
  var i = Math.min(n, MAPS_PER_GAME);          // night 7 runs night 6's map
  return NIGHT_MAPS[g + '-' + i] || (MAP_BASE + g + '-' + i + '.png');
}
/* The six maps behind a game card, in night order. */
function gameMaps(g){
  var out = [];
  for (var i = 1; i <= MAPS_PER_GAME; i++) out.push(nightArt(g, i));
  return out;
}

/* ─── rewards, resolved by name ──────────────────────────────────────────
   Icons and rarities come from the item feeds through the worker's /inf-data
   proxy, so adding a reward later means adding a name here and nothing else.
   Only what no feed carries needs a manual icon — XP has no item entry. */
var REWARD_DEFS = [
  {key:'coins', name:'Tokens'},
  {key:'candy', name:'Candy Bar'},
  // width=96 because the source is a 50 KB full-size render shown at 42px;
  // that host resizes on request, which brings it to 6 KB.
  // XP is the one reward no feed carries — the potions feed has XP Potion 1 and
  // 2, which are different items — so it keeps a stated icon. The other two
  // resolve by name, and drop their entry here the day a feed carries XP.
  {key:'exp',   name:'XP',
   icon:'https://primary.jwwb.nl/public/g/h/p/temp-xkzspsgvvlzquzykopjj/pasted-image-thu-jan-22-2026-10-26-48-gmt-0600-central-standard-time-high.png?enable-io=true&width=96'}
];
var RARITY = {
  uncommon:'linear-gradient(90deg,#5CFF4D,#3FFF8F)', rare:'linear-gradient(90deg,#58A6FF,#1C3AA0)',
  epic:'linear-gradient(90deg,#FF35FF,#87009F)',     mythic:'linear-gradient(90deg,#FFB81F,#FFFF00)',
  secret:'linear-gradient(90deg,#FF8800,#FF0C0C)',   nightmare:'linear-gradient(90deg,#492590,#2A1E42)',
  apex:'linear-gradient(90deg,#9D0078,#0063F8)',     hero:'linear-gradient(90deg,#FFCD19,#353815,#FFFB85)',
  exclusive:'linear-gradient(90deg,rgb(140,255,203),rgb(51,231,255),rgb(79,164,255))',
  radiant:'linear-gradient(90deg,#FF6600,#FFCC33)'
};
var ITEM = {}, itemsReady = false, onItems = [];
(function loadItems(){
  /* /inf-data is a worker route, so it only exists on the deployed site. Opening
     this file directly 404s it and every icon comes back empty, so a miss
     retries against the live origin — the proxy sends access-control-allow-
     origin:*, so that works from anywhere. Deployed, the relative path hits
     first and nothing crosses the network twice. */
  var LIVE = 'https://www.fntduserguide.com';
  function J(u){
    return fetch(u)
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .catch(function(){ return fetch(LIVE+u).then(function(r){ return r.json(); }).catch(function(){ return {}; }); });
  }
  Promise.all([J('/inf-data/materials'),J('/inf-data/foods'),J('/inf-data/potions')]).then(function(res){
    res.forEach(function(obj){
      Object.keys(obj||{}).forEach(function(n){
        var k = n.toLowerCase();
        if (!ITEM[k]) ITEM[k] = {image:(obj[n]||{}).image||'', rarity:((obj[n]||{}).rarity||'').toLowerCase()};
      });
    });
    itemsReady = true;
    onItems.forEach(function(fn){ fn(); });
    onItems = [];
  });
})();

/* ─── per-night notes ────────────────────────────────────────────────────
   Keyed "<game>-<night>". time is a clear time, video an optional link — the
   line reads "Clear time: 2:30 - Video" and drops the link when there is none.
   Teams are per tier; a night with no entry falls back to the placeholders. */
var NIGHT_INFO = {
  /* Map layout per night, from the game. Night 7 has no entry of its own — it

  '1-1':{notes:['One entrance and one exit'], cash:500},
  '1-2':{notes:['Two entrances and one exit'], cash:500},
  '1-3':{notes:['Three entrances and one exit'], cash:500},
  '1-4':{notes:['Two entrances and one exit'], cash:500},
  '1-5':{notes:['Three entrances and one exit'], cash:500},
  '1-6':{notes:['Three entrances and two exits'], cash:500},
  '2-1':{notes:['Two entrances and one exit'], cash:2000},
  '2-2':{notes:['Two entrances and two exits'], cash:2500},
  '2-3':{notes:['Two entrances and one exit'], cash:3000},
  '2-4':{notes:['Two entrances and two exits'], cash:5000},
  '2-5':{notes:['Three entrances and two exits'], cash:7000},
  '2-6':{notes:['Three entrances and two exits'], cash:8000},
  '3-1':{notes:['One entrance and one exit'], cash:2000},
  '3-2':{notes:['One entrance and two exits'], cash:2500},
  '3-3':{notes:['Two entrances and two exits'], cash:3000},
  '3-4':{notes:['Two entrances and two exits'], cash:5000},
  '3-5':{notes:['Two entrances and two exits'], cash:7000},
  '3-6':{notes:['Four entrances and one exit'], cash:8000},
  '4-1':{notes:['Three entrances and one exit'], cash:2000},
  '4-2':{notes:['Two entrances and two exits'], cash:2500},
  '4-3':{notes:['Two entrances and two exits'], cash:3000},
  '4-4':{notes:['Two entrances and one exit'], cash:5000},
  '4-5':{notes:['Three entrances and one exit'], cash:7000},
  '4-6':{notes:['Two entrances and two exits'], cash:8000},
  '5-1':{notes:['Two entrances and two exits'], cash:2000, video:'https://images.fntduserguide.com/game5night1.mp4', best:true},
  '5-2':{notes:['Two entrances and two exits'], cash:2500},
  '5-3':{notes:['Four entrances and one exit'], cash:3000},
  '5-4':{notes:['Two entrances and one exit'], cash:5000},
  '5-5':{notes:['Four entrances and one exit'], cash:7000},
  '5-6':{notes:['Two entrances and two exits'], cash:8000},

  '6-4':{notes:['Two entrances and one exit'], cash:5000},
  '6-5':{notes:['Two entrances and two exits'], cash:7000},
  '6-6':{notes:['One entrance and one exit'], cash:8000},
  '7-1':{notes:['One entrance and one exit'], cash:2000},
  '7-2':{notes:['One entrance and one exit'], cash:2500},
  '7-3':{notes:['One entrance and one exit'], cash:3000},
  '7-4':{notes:['One entrance and one exit'], cash:5000},
  '7-5':{notes:['One entrance and one exit'], cash:7000},
  '7-6':{notes:['Two entrances and one exit'], cash:8000}
};
/* Chance drops, keyed "<game>-<night>". name resolves its icon and rarity from
   the item feeds like everything else, so only the name, how many and the odds
   are authored here. Empty until we work through the nights; a night with no
   entry shows "Not recorded yet" rather than an empty row.
   Currently one list per night — if the drops turn out to differ by tier or by
   night-7 difficulty, this becomes a lookup on those too. */
/* ─── chance drops ───────────────────────────────────────────────────────
   Amounts are the Easy values. Nightmare is x1.5 rounded half up — the same
   multiplier and rounding the fixed rewards use, and it reproduces all 18
   measured ranges exactly, specials included (1 x 1.5 = 1.5 -> 2).
   Every amount takes that x1.5, the Luck Potion included. Chances hold across
   tiers; only the Luck Potion's moves, 1% to 2% — so it is the one drop where
   both halves change.
   Every name here resolves its icon and rarity from the item feeds. */
var RNG_BASE = {

/* Tied to particular nights. 1 on Easy and 2 on Nightmare, and — unlike the
   common drops — the count does not move with difficulty: a Hazard Sign or a
   Cloak is still 2 at difficulty 20, not 3. Hence qtyScale:'tier'.
   "all" covers every night. */
var RNG_SPECIAL = {
  1: {6:[{name:'Hazard Sign',min:1,max:1,chance:7,qtyScale:'tier'}]},
  2: {1:[{name:'Colonel Hat',min:1,max:1,chance:10,qtyScale:'tier'}],

  3: {2:[{name:'Glitched TV',min:1,max:1,chance:12,qtyScale:'tier'}]},
  4: {all:[{name:'Nightmare Balloons',min:1,max:1,chance:5,qtyScale:'tier'}]}
};
/* Drops that only start once the difficulty is high enough — the same gate the
   chips sit behind.
   The Soldering Iron stays at 1 on Nightmare where every other special goes to
   2, so its count is held flat against both axes. The chance still scales:
   10% base, 10.5% at difficulty 2, 15% at 20. */
var DIFF_DROPS = [{name:'Soldering Iron', min:1, max:1, chance:10, qtyScale:'none'}];

function rngDropsFor(g,n,d){
  var out = [], seen = {};
  function add(list){
    (list || []).forEach(function(e){ if (!seen[e.name]){ seen[e.name] = 1; out.push(e); } });
  }
  add(RNG_BASE[g]);
  var sp = RNG_SPECIAL[g] || {};
  add(sp.all);
  add(sp[n]);
  // a night-6 special drops on night 7 as well
  if (n === 7) add(sp[6]);
  if (n === 7 && d >= CHIP_MIN_DIFF) add(DIFF_DROPS);
  return out;
}

/* ─── chip drops ─────────────────────────────────────────────────────────

   Which chip depends on the game. Both figures come from the INFO panel's own
   chips section in _worker.js, so change them there and here together.
   A chip drops as Part A or Part B at random — that is one drop with two
   possible renders, so it is shown as a single entry carrying both. */
var CHIP_BY_GAME = {

  5:'Crowd Culler',       6:'Blazing Fire', 7:'Serrated Edge'

  {rarity:'secret',    chance:'15%'},

];

   they are listed here exactly as _worker.js lists them. */

  'Blazing Fire':      'https://images.fntduserguide.com/blazing%20fire%20B.png',
  'Crowd Culler':      'https://images.fntduserguide.com/crowd%20culler%20B.png',

  'Weak Point':        'https://images.fntduserguide.com/weak%20point%20B.png'

(function loadChips(){

    .then(function(r){ return r.json(); })
    .then(function(d){

/* Which meta each game's Recommended Team comes from. A plain string is used for
   both tiers; {easy,nightmare} splits them where a game needs different teams.
   '*' catches every game without an entry of its own.
   Game 1 runs its own team across all seven nights and does not change by tier.
   NIGHT_TEAM overrides a single night, same two shapes. */
var GAME_TEAM = {
  1:   'Game 1',
  '*': {easy:'Story Grind', nightmare:'Story Nightmare'}
};
var NIGHT_TEAM = {
  // '2-7': 'Some Meta'   or   '2-7': {easy:'A', nightmare:'B'}
};

var GAMES = [1,2,3,4,5,6,7];
var NIGHTS = [1,2,3,4,5,6,7];

function el(tag, cls, txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }

/* ─── the team, borrowed from the meta engine ─────────────────────────── */
var borrowed = null;
function borrowTeam(name){
  var mount = document.querySelector('#teamStore .metaMount[data-meta="' + String(name).replace(/"/g,'\\"') + '"]');
  var row = mount && mount.querySelector('.metaRow');
  if (!row) return null;
  borrowed = { row: row, home: row.parentNode, next: row.nextSibling };
  return row;
}
function returnTeam(){
  if (!borrowed) return;
  borrowed.home.insertBefore(borrowed.row, borrowed.next);
  borrowed = null;
}
function teamNameFor(g,n,tier){
  var src = NIGHT_TEAM[g+'-'+n] || GAME_TEAM[g] || GAME_TEAM['*'];
  return (typeof src === 'string') ? src : (src && src[tier]) || null;
}
/* Every meta any game might ask for, so the engine has rendered them before a
   popup goes looking. Kept in step with GAME_TEAM / NIGHT_TEAM by hand — a name
   missing here renders "not recorded yet" rather than failing. */
function teamMetasUsed(){
  var seen = {}, out = [];
  function add(v){
    if (!v) return;
    if (typeof v === 'string'){ if(!seen[v]){seen[v]=1;out.push(v);} return; }
    Object.keys(v).forEach(function(k){ add(v[k]); });
  }
  Object.keys(GAME_TEAM).forEach(function(k){ add(GAME_TEAM[k]); });
  Object.keys(NIGHT_TEAM).forEach(function(k){ add(NIGHT_TEAM[k]); });
  return out;
}

/* ─── step 3: rewards ─────────────────────────────────────────────────── */
/* One tile, whatever it is for. Icon and rarity resolve by name from the item
   feeds; fallback carries a manual icon for the few things no feed has. chance
   is folded into the hover card's amount line, since a drop is worth showing
   next to how much of it you get. */
function makeTile(name, qty, chance, fallback){
  var meta = ITEM[String(name).toLowerCase()] || {};
  var icon = meta.image || (fallback && fallback.icon) || '';
  var rar  = (meta.rarity || (fallback && fallback.rarity) || '').toLowerCase();
  var amount = (qty || '') + (chance ? ' (' + chance + ')' : '');
  var t = el('div','chRw');
  t.style.background = RARITY[rar] || '#555';
  t.setAttribute('aria-label', name + (amount ? ' ' + amount : ''));
  // the worker's shared hover card, same one the meta engine shows for units
  t.setAttribute('data-rwtip', JSON.stringify({name:name, qty:amount, rarity:rar, icon:icon}));
  t.setAttribute('data-rwtip-tap','');
  var inn = el('div','chRw-in');
  var im = document.createElement('img'); im.src=icon; im.alt=name; im.loading='lazy'; inn.appendChild(im);
  t.appendChild(inn);
  if (qty) t.appendChild(el('span','chQty', qty));
  return t;
}
/* Paid on every clear, straight off the reward model. */
function fixedTiles(r){
  var wrap = el('div','ch-rewards');
  REWARD_DEFS.forEach(function(d){ wrap.appendChild(makeTile(d.name, 'x'+r[d.key], null, d)); });
  return wrap;
}
/* Chances carry a decimal once difficulty scales them, so trim rather than pad:
   10.5, 1.5, 75 — not 10.50 or 75.0. */
function pct(v){ return String(Math.round(v*10)/10) + '%'; }

/* One chance drop, scaled for tier then difficulty — the same order and the
   same x(1 + d/40) the fixed rewards use, applied to the amount AND the odds.
   Confirmed by two independent readings: the Luck Potion reaching 1.5% at d20
   (1 x 1.5) and the Soldering Iron reading 10.5% at d2 (10 x 1.025... = 10.5). */
function rngTiles(list, tier, d){
  var wrap = el('div','ch-rewards');
  var nm = tier === 'nightmare';
  var k = (curN === 7) ? (40 + d) / 40 : 1;    // difficulty exists on night 7 only
  list.forEach(function(e){
    var chance = (nm && e.nmChance != null) ? e.nmChance : e.chance;
    chance = chance * k;
    var amount = '';
    if (e.min != null){
      // round after the tier, then again after the difficulty, as rewardsFor does
      /* qtyScale says which axes move the count:
           'both' (default) commons — tier x1.5 then difficulty x(1 + d/40)
           'tier'            specials — 1 on Easy, 2 on Nightmare, flat across d
           'none'            Soldering Iron — always 1
         Chances scale with difficulty in every case. */
      var sc = e.qtyScale || 'both';
      var tm = (nm && sc !== 'none') ? 1.5 : 1;
      var dm = (sc === 'both') ? k : 1;
      var lo = rh(rh(e.min*tm) * dm), hi = rh(rh(e.max*tm) * dm);
      // "x" prefix so a chance drop reads the same as a fixed reward
      amount = 'x' + ((lo === hi) ? lo : (lo + '~' + hi));
    }
    var t = makeTile(e.name, amount, null, null);
    // rebuild the hover so it carries the odds as well as the amount
    var meta = ITEM[e.name.toLowerCase()] || {};
    t.setAttribute('data-rwtip', JSON.stringify({
      name: e.name,
      qty: amount || pct(chance),
      label: amount ? 'Amount' : 'Chance',
      note: amount ? ('Chance: ' + pct(chance)) : '',
      rarity: (meta.rarity || '').toLowerCase(),
      icon: meta.image || ''
    }));
    t.setAttribute('aria-label', e.name + (amount ? ' ' + amount : '') + ' at ' + pct(chance));
    t.appendChild(el('span','chOdds', pct(chance)));
    wrap.appendChild(t);
  });
  return wrap;
}

/* One chip, both of its renders, offset on a single plate. */
function chipTile(name, rarity, chance){
  var t = el('div','chRw chRw-pair');
  t.style.background = RARITY[rarity] || '#555';
  t.setAttribute('aria-label', name + ' — ' + chance + ' (Part A or Part B)');
  t.setAttribute('data-rwtip', JSON.stringify({
    name: name + ' (Part A or B)', qty: chance, label: 'Chance',
    rarity: rarity, icon: CHIP_ART[name] || ''
  }));
  t.setAttribute('data-rwtip-tap','');
  var inn = el('div','chRw-in');
  // B first so it paints behind A
  [['chip-b', CHIP_PART_B[name] || '', ' Part B'],
   ['chip-a', CHIP_ART[name]    || '', ' Part A']].forEach(function(p){
    var im = document.createElement('img');
    im.className = p[0]; im.src = p[1]; im.alt = name + p[2]; im.loading = 'lazy';
    inn.appendChild(im);
  });
  t.appendChild(inn);
  // odds on the right, same place every other drop shows them; a chip has no
  // amount, so nothing sits bottom-left
  t.appendChild(el('span','chOdds', chance));
  return t;
}
function chipTiles(g){
  var name = CHIP_BY_GAME[g];
  var wrap = el('div','ch-rewards');
  if (!name) return wrap;
  CHIP_RARITIES.forEach(function(c){ wrap.appendChild(chipTile(name, c.rarity, c.chance)); });
  return wrap;
}

/* Night 7 has no entry of its own — it runs night 6's map, so it reads night
   6's line, matching how its art and its specials already carry over. */
/* Placeholder until the real per-night figures land. Any night without its own
   cash reads this; setting cash on a night in NIGHT_INFO takes over. */
var CASH_PLACEHOLDER = 500;
function cashFor(g,n){
  var c = nightInfo(g,n).cash;
  return c != null ? c : CASH_PLACEHOLDER;
}
/* best:true marks the night worth farming. The night card is highlighted, and
   so is its game on the selection screen — so you can see which game holds one
   before opening it. Not inherited by night 7: mark '<game>-7' itself. */
function isBestNight(g,n){ return !!nightInfo(g,n).best; }
function gameHasBest(g){
  for (var n = 1; n <= NIGHTS.length; n++) if (isBestNight(g,n)) return true;
  return false;
}
function cashText(g,n){ return 'Starting Cash: ' + Number(cashFor(g,n)).toLocaleString('en-US'); }
function nightInfo(g,n){
  var own = NIGHT_INFO[g+'-'+n] || {};
  if (n !== 7) return own;
  /* Night 7 runs night 6's map, so it borrows the layout line and the starting
     cash — the cash figures are given as covering nights 1-7, and only six are
     listed per game. Its clear time and video stay its own: a night 7 is a
     different run, which is why it reads "No records for night 7s" rather than
     showing night 6's time. Give a '<game>-7' entry its own cash to override. */
  var six = NIGHT_INFO[g+'-6'] || {};
  return {title: own.title || six.title, notes: own.notes || six.notes,
          cash: own.cash != null ? own.cash : six.cash,
          time: own.time, video: own.video, best: own.best};
}
function clearLine(g,n){
  var info = nightInfo(g,n);
  var d = el('div','chPop-diff');
  // a night 7 with nothing of its own says so, rather than showing night 6's run
  if (n === 7 && !info.time && !info.video){ d.textContent = 'No records for night 7s'; return d; }
  // one fallback, so a night with a video but no time still reads properly
  // rather than falling through to a bare dash
  d.appendChild(document.createTextNode('Clear time: ' + (info.time || 'not recorded yet')));
  if (info.video){
    d.appendChild(document.createTextNode(' - '));
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'vid'; b.textContent = 'Video';
    b.addEventListener('click', function(ev){ ev.stopPropagation(); playVideo(info.video); });
    d.appendChild(b);
  }
  return d;
}

/* Opens the clip over the page rather than sending you to YouTube.
   Deliberately not the INFO panel's infPlayMinigame, even for a self-hosted
   file: that player fills the screen and letterboxes anything that is not the
   viewport's shape. This one sizes the frame to the clip, so there are no black
   bars — and it behaves the same locally and on the live site, where the INFO
   panel may or may not have loaded. A YouTube link cannot go in a <video> at
   all, so it gets an embed in the same frame. */
function videoEmbed(url){
  var m = String(url).match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]{6,})/);
  return m ? 'https://www.youtube.com/embed/' + m[1] + '?autoplay=1&rel=0' : null;
}
function playVideo(url){
  var fs = el('div','nrVid');
  var close = document.createElement('button');
  close.className = 'nrVid-close'; close.type = 'button';
  close.setAttribute('aria-label','Close'); close.innerHTML = '&#x2715;';
  var embed = videoEmbed(url);
  var media;
  if (embed){
    media = document.createElement('iframe');
    media.src = embed; media.allow = 'autoplay; encrypted-media; picture-in-picture';
    media.allowFullscreen = true;
  } else {
    media = document.createElement('video');
    media.src = url; media.controls = true; media.playsInline = true;
    media.setAttribute('playsinline',''); media.setAttribute('webkit-playsinline','');
  }
  function done(){
    if (!fs.parentNode) return;
    try { media.pause && media.pause(); } catch(e){}
    media.src = '';                       // stops an embed playing on after close
    document.removeEventListener('keydown', onKey);
    fs.parentNode.removeChild(fs);
  }
  function onKey(e){ if (e.key === 'Escape') done(); }
  close.addEventListener('click', function(e){ e.stopPropagation(); done(); });
  fs.addEventListener('click', function(e){ if (e.target === fs) done(); });
  document.addEventListener('keydown', onKey);
  fs.appendChild(media); fs.appendChild(close); document.body.appendChild(fs);
  if (media.play) media.play().catch(function(){});
}

function renderRewards(){
  var g=curG, n=curN;
  var box = document.getElementById('rwIn');
  returnTeam();
  box.innerHTML = '';
  var h = el('div','chPop-name','Game '+g+' — Night '+n); h.id='rwName';
  box.appendChild(h);
  box.appendChild(clearLine(g,n));

  box.appendChild(el('div','chSec','Difficulty'));
  var seg = el('div','nrSeg');
  TIERS.forEach(function(t){
    var b = el('button',null,t.label); b.type='button';
    b.setAttribute('aria-pressed', String(curTier===t.key));
    b.addEventListener('click', function(){ curTier=t.key; renderRewards(); });
    seg.appendChild(b);
  });
  box.appendChild(seg);

  if (n === 7){
    box.appendChild(el('div','chSec','Night 7 Difficulty'));
    var slide = el('div','nrSlide');
    var lbl = el('div','nrSlideLbl','DIFFICULTY ' + curD + '/' + MAX_DIFF);
    var rng = document.createElement('input');
    rng.type='range'; rng.min='1'; rng.max=String(MAX_DIFF); rng.step='1';
    rng.value=String(curD); rng.className='nrRange';
    rng.setAttribute('aria-label','Night 7 difficulty');
    // Redraw the tiles as it moves, not the whole popup — a full rebuild would
    // replace the input mid-drag and drop the pointer.
    rng.addEventListener('input', function(){
      curD = parseInt(rng.value,10) || 1;
      lbl.textContent = 'DIFFICULTY ' + curD + '/' + MAX_DIFF;
      paintRewards();
    });
    slide.appendChild(lbl); slide.appendChild(rng);
    box.appendChild(slide);
  }

  // Optional per-night notes, laid out like the Challenges Restrictions block.
  // The heading is per entry so a night can call it something other than
  // Restrictions; the whole section is skipped when a night has no notes.
  var info = nightInfo(g,n);
  if ((info.notes && info.notes.length) || cashFor(g,n) != null){
    box.appendChild(el('div','chSec', info.title || 'Info'));
    var rl = el('div','chRestr');
    (info.notes || []).forEach(function(line){ rl.appendChild(el('div','chRline','● ' + line)); });
    // Starting cash is per night, so it reads as another line of the night's
    // own detail rather than as something the night pays out.
    rl.appendChild(el('div','chRline','● ' + cashText(g,n)));
    box.appendChild(rl);
  }

  box.appendChild(el('div','chSec','Fixed Rewards'));
  var host = el('div'); host.id = 'rwTiles';
  box.appendChild(host);
  paintRewards();

  var rngHead = el('div','chSec','RNG Rewards'); rngHead.id = 'rwRngHead';
  box.appendChild(rngHead);
  var rngHost = el('div'); rngHost.id = 'rwRng';
  box.appendChild(rngHost);
  paintRng();

  // team last, so the numbers read before the six unit cards push them down
  var team = borrowTeam(teamNameFor(g,n,curTier));
  box.appendChild(el('div','chSec','Recommended Team'));
  if (team) box.appendChild(team);
  else box.appendChild(el('div','nrMuted','Team not recorded for this night yet.'));
  // icons arrive with the feeds; repaint once if they were not ready in time
  if (!itemsReady) onItems.push(function(){ if (!document.getElementById('rwOv').hidden) paintRewards(); });
}

/* Just the tiles, so the slider can repaint on every step without rebuilding
   the popup around it. */
function paintRewards(){
  var host = document.getElementById('rwTiles');
  if (!host) return;
  host.innerHTML = '';
  host.appendChild(fixedTiles(rewardsFor(curG,curN,curTier,curD)));
  paintRng();
}

/* Repainted alongside the fixed rewards because the chip drop depends on the
   night-7 difficulty, so it has to follow the slider. */
function paintRng(){
  var host = document.getElementById('rwRng');
  if (!host) return;
  host.innerHTML = '';
  // not "rng": that is the slider input in renderRewards, and var is
  // function-scoped, so reusing the name would rebind it in its own listener
  var drops = rngDropsFor(curG, curN, curD);
  var chips = curN === 7 && curD >= CHIP_MIN_DIFF;
  // The heading carries the chip requirement while it is unmet, so the row does
  // not need a line of its own saying so — and drops back to plain "RNG Rewards"
  // once the difficulty qualifies.
  var head = document.getElementById('rwRngHead');
  if (head) head.textContent = (curN === 7 && !chips)
    ? 'RNG Rewards - Chips on Diff ' + CHIP_MIN_DIFF + '+'
    : 'RNG Rewards';
  // night 7 pays its chance drops and, from difficulty 2, a chip on top
  if (drops.length) host.appendChild(rngTiles(drops, curTier, curD));
  if (chips) host.appendChild(chipTiles(curG));
  if (!drops.length && !chips) host.appendChild(el('div','nrMuted','Not recorded yet.'));
}

function openRewards(g,n){
  curG=g; curN=n; curD=1;
  // Same art as the night card you came from, the way Challenges puts a
  // challenge's map behind its popup.
  document.getElementById('rwPop').style.backgroundImage = 'url("'+nightArt(g,n)+'")';
  document.getElementById('rwOv').hidden = false;
  renderRewards();
  document.body.style.overflow='hidden';
  document.body.classList.add('ch-modal');
  document.getElementById('rwClose').focus();
}
function closeRewards(){
  returnTeam();
  document.getElementById('rwOv').hidden = true;
  document.getElementById('rwIn').scrollTop = 0;
  if (document.getElementById('nsOv').hidden){
    document.body.style.overflow='';
    document.body.classList.remove('ch-modal');
  } else {
    document.getElementById('nsClose').focus();
  }
}

/* ─── wiring ──────────────────────────────────────────────────────────── */
document.getElementById('nsClose').addEventListener('click', closeNights);
document.getElementById('rwClose').addEventListener('click', closeRewards);
document.getElementById('nsOv').addEventListener('click', function(e){ if(e.target===this) closeNights(); });
document.getElementById('rwOv').addEventListener('click', function(e){ if(e.target===this) closeRewards(); });
/* Escape peels one layer at a time, matching what the buttons do. */
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (!document.getElementById('rwOv').hidden) closeRewards();
  else if (!document.getElementById('nsOv').hidden) closeNights();
});

/* The reward hover is injected by the worker, so it is missing when this file is
   opened directly. Install a stand-in only in that case — deployed, the worker's
   copy sets the flag first and this stays out of the way. Preview only; the real
   implementation lives in _worker.js as REWARD_TIP. */
window.addEventListener('load', function(){
  if (window.__ugRewardTip) return;
  var cur=null;
  function els(){var t=document.getElementById('metaTip'),i=document.getElementById('metaTipInner');return t&&i?[t,i]:null;}
  function hide(){var e=els();if(e){e[0].style.opacity='0';e[0].style.display='none';}}
  function show(el,cfg){
    var e=els();if(!e)return;
    var tip=e[0],inner=e[1],rar=(cfg.rarity||'').toLowerCase(),bg=RARITY[rar]||'#888888';
    tip.style.background=bg;inner.innerHTML='';
    var nm=document.createElement('span');nm.className='mt-name';nm.textContent=cfg.name||'';inner.appendChild(nm);
    var hr=document.createElement('hr');hr.className='mt-sep';inner.appendChild(hr);
    var row=document.createElement('div');row.className='mt-row';
    if(cfg.icon){
      var ic=document.createElement('div');ic.className='mt-icon';ic.style.background=bg;
      var inn=document.createElement('div');inn.className='mt-icon-in';
      var im=document.createElement('img');im.src=cfg.icon;im.alt='';
      im.style.cssText='width:100%;height:100%;object-fit:contain;display:block;margin:0;max-width:none';
      inn.appendChild(im);ic.appendChild(inn);row.appendChild(ic);
    }
    if(cfg.qty){var tx=document.createElement('div');tx.className='mt-text';tx.textContent=(cfg.label||'Amount')+': '+cfg.qty;row.appendChild(tx);}
    inner.appendChild(row);
    if(cfg.note){var rn=document.createElement('div');rn.className='mt-row';
      var tn=document.createElement('div');tn.className='mt-text';tn.textContent=cfg.note;rn.appendChild(tn);inner.appendChild(rn);}
    if(rar){var r2=document.createElement('div');r2.className='mt-row';
      var t2=document.createElement('div');t2.className='mt-text';
      t2.textContent='Rarity: '+rar.charAt(0).toUpperCase()+rar.slice(1);r2.appendChild(t2);inner.appendChild(r2);}
    tip.style.display='block';tip.style.opacity='0';
    var r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
    var left=Math.max(4,Math.min(r.left+r.width/2-tw/2,window.innerWidth-tw-4));
    var top=r.bottom+6; if(top+th>window.innerHeight-4) top=r.top-th-6;
    tip.style.left=left+'px';tip.style.top=top+'px';tip.style.opacity='1';
  }
  function tile(n){return n&&n.closest?n.closest('[data-rwtip]'):null;}
  document.addEventListener('mouseover',function(ev){
    var t=tile(ev.target);
    if(t&&t!==cur){try{cur=t;show(t,JSON.parse(t.getAttribute('data-rwtip')));}catch(e){}}
  });
  document.addEventListener('mouseout',function(ev){
    if(!cur)return;
    if(ev.relatedTarget&&cur.contains(ev.relatedTarget))return;
    cur=null;hide();
  });
  document.addEventListener('click',function(ev){
    var t=tile(ev.target);
    if(t&&t.hasAttribute('data-rwtip-tap')){ev.stopPropagation();try{cur=t;show(t,JSON.parse(t.getAttribute('data-rwtip')));}catch(e){}return;}
    cur=null;hide();
  },true);
  window.addEventListener('scroll',function(){cur=null;hide();},{passive:true});
});

/* Mount every meta the config asks for. This runs while the page is still
   parsing, so it lands before metas.html's own <script src> further down —
   which is when the engine reads these and renders into them. */
(function(){
  var store = document.getElementById('teamStore');
  if (!store) return;
  teamMetasUsed().forEach(function(name){
    var m = document.createElement('div');
    m.className = 'metaMount';
    m.setAttribute('data-meta', name);
    store.appendChild(m);
  });
})();

var list = document.getElementById('nrGames');
GAMES.forEach(function(g){ list.appendChild(gameCard(g)); });
})();
