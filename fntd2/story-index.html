function pct(v){ return String(Math.round(v*10)/10) + '%'; }

function rngTiles(list, tier, d){
  var wrap = el('div','ch-rewards');
  var nm = tier === 'nightmare';
  var k = (curN === 7) ? (40 + d) / 40 : 1;   
  list.forEach(function(e){
    var chance = (nm && e.nmChance != null) ? e.nmChance : e.chance;
    chance = chance * k;
    var amount = '';
    if (e.min != null){
      var sc = e.qtyScale || 'both';
      var tm = (nm && sc !== 'none') ? 1.5 : 1;
      var dm = (sc === 'both') ? k : 1;
      var lo = rh(rh(e.min*tm) * dm), hi = rh(rh(e.max*tm) * dm);
      amount = 'x' + ((lo === hi) ? lo : (lo + '~' + hi));
    }
    var t = makeTile(e.name, amount, null, null);
    var meta = ITEM[e.name.toLowerCase()] || {};
    t.setAttribute('data-rwtip', JSON.stringify({
      name: e.name,
      qty: amount || pct(chance),
      label: amount ? 'Amount' : 'Chance',
      note: amount ? ('Chance: ' + pct(chance)) : '',
      rarity: (meta.rarity || '').toLowerCase(),
      icon: meta.image || ''
    }));
    t.setAttribute('aria-label', e.name + (amount ? ' ' + amount : '') + ' at ' + pct(chance));
    t.appendChild(el('span','chOdds', pct(chance)));
    wrap.appendChild(t);
  });
  return wrap;
}

  }));

  [['chip-b', CHIP_PART_B[name] || '', ' Part B'],
   ['chip-a', CHIP_ART[name]    || '', ' Part A']].forEach(function(p){
    var im = document.createElement('img');
    im.className = p[0]; im.src = p[1]; im.alt = name + p[2]; im.loading = 'lazy';

function videoEmbed(url){
  var m = String(url).match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]{6,})/);
  return m ? 'https://www.youtube.com/embed/' + m[1] + '?autoplay=1&rel=0' : null;
}
function playVideo(url){
  var embed = videoEmbed(url);
  if (!embed && typeof infPlayMinigame === 'function'){ infPlayMinigame(url); return; }

  var fs = el('div','nrVid');
  var close = document.createElement('button');
  close.className = 'nrVid-close'; close.type = 'button';
  close.setAttribute('aria-label','Close'); close.innerHTML = '&#x2715;';
  var media;
  if (embed){
    media = document.createElement('iframe');
    media.src = embed; media.allow = 'autoplay; encrypted-media; picture-in-picture';
    media.allowFullscreen = true;
  } else {
    media = document.createElement('video');
    media.src = url; media.controls = true; media.playsInline = true;
    media.setAttribute('playsinline',''); media.setAttribute('webkit-playsinline','');
  }
  var exited = false;
  function done(){
    if (exited) return;
    exited = true;
    try { media.pause && media.pause(); } catch(e){}
    media.src = '';                      
    document.removeEventListener('keydown', onKey);
    document.removeEventListener('fullscreenchange', onFsChange);
    document.removeEventListener('webkitfullscreenchange', onFsChange);
    var fsel = document.fullscreenElement || document.webkitFullscreenElement;
    if (fsel) (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
    if (fs.parentNode) fs.parentNode.removeChild(fs);
  }
  function onKey(e){ if (e.key === 'Escape') done(); }
  function onFsChange(){
    var fsel = document.fullscreenElement || document.webkitFullscreenElement;
    if (fsel === fs) fs._entered = true; else if (fs._entered) done();
  }
  close.addEventListener('click', function(e){ e.stopPropagation(); done(); });
  fs.addEventListener('click', function(e){ if (e.target === fs) done(); });
  media.addEventListener('webkitendfullscreen', done);
  document.addEventListener('keydown', onKey);
  fs.appendChild(media); fs.appendChild(close); document.body.appendChild(fs);
  if (media.play) media.play().catch(function(){});
  var rq = fs.requestFullscreen || fs.webkitRequestFullscreen || fs.msRequestFullscreen;
  if (rq){
    document.addEventListener('fullscreenchange', onFsChange);
    document.addEventListener('webkitfullscreenchange', onFsChange);
    try { var pr = rq.call(fs); if (pr && pr.catch) pr.catch(function(){}); } catch(e){}
  } else if (media.webkitEnterFullscreen){
    if (media.readyState >= 1){ try { media.webkitEnterFullscreen(); } catch(e){} }
    else media.addEventListener('loadedmetadata', function(){ try { media.webkitEnterFullscreen(); } catch(e){} }, {once:true});
  }
}
